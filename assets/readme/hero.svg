<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">SLURM Dashboard — a self-hosted web dashboard for SLURM and Linux beginners</title>
  <desc id="hero-desc">A self-hosted web dashboard for SLURM and Linux beginners. Miniature cluster-status card shows partitions, per-user GPU utilization and jobs, each annotated with the real command behind it: sinfo, squeue, sbatch, nvidia-smi.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Canvas: app dark theme page background -->
  <rect width="1200" height="420" rx="20" fill="#020617" stroke="#1E293B"/>

  <g id="title-block" transform="translate(72 0)">
    <!-- Eyebrow: positioning metadata -->
    <text class="mono" x="0" y="106" font-size="16" letter-spacing="4" fill="#64748B">SELF-HOSTED · LOOPBACK-ONLY</text>

    <!-- Product name -->
    <text class="sans" x="0" y="188" font-size="56" font-weight="700" fill="#F8FAFC">SLURM Dashboard</text>

    <!-- Command vocabulary chips -->
    <g id="command-chips" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" fill="#E2E8F0">
      <rect x="0" y="222" width="100" height="48" rx="24" fill="#1A1F2E" stroke="#334155"/>
      <text x="30" y="253">sinfo</text>
      <rect x="114" y="222" width="112" height="48" rx="24" fill="#1A1F2E" stroke="#334155"/>
      <text x="144" y="253">squeue</text>
      <rect x="240" y="222" width="112" height="48" rx="24" fill="#1A1F2E" stroke="#334155"/>
      <text x="270" y="253">sbatch</text>
      <rect x="366" y="222" width="160" height="48" rx="24" fill="#1A1F2E" stroke="#334155"/>
      <text x="396" y="253">nvidia-smi</text>
    </g>

    <!-- Loopback access line -->
    <rect x="0" y="294" width="576" height="48" rx="10" fill="#080C1A" stroke="#1E293B"/>
    <text class="mono" x="20" y="327" font-size="19" fill="#10B981">$</text>
    <text class="mono" x="46" y="327" font-size="19" fill="#E2E8F0">ssh -L 7860:127.0.0.1:7860 user@your-server</text>
    <rect x="552" y="316" width="10" height="22" rx="2" fill="#10B981"/>
  </g>

  <!-- Miniature cluster-status card: proof motif -->
  <g id="dashboard-card" transform="translate(700 48)">
    <rect width="428" height="324" rx="14" fill="#0E1223" stroke="#334155"/>

    <!-- Card header -->
    <text class="mono" x="20" y="28" font-size="15" fill="#94A3B8">CLUSTER STATUS</text>
    <text class="mono" x="408" y="27" font-size="13" text-anchor="end" fill="#64748B">127.0.0.1:7860</text>
    <path d="M 16 40 L 412 40" stroke="#1E293B" stroke-width="1"/>

    <!-- Partitions: node state matrix -->
    <text class="sans" x="20" y="74" font-size="16" fill="#94A3B8">Partitions</text>
    <g id="node-grid">
      <rect x="20" y="88" width="22" height="22" rx="5" fill="#10B981"/>
      <rect x="50" y="88" width="22" height="22" rx="5" fill="#3B82F6"/>
      <rect x="80" y="88" width="22" height="22" rx="5" fill="#10B981"/>
      <rect x="110" y="88" width="22" height="22" rx="5" fill="#F59E0B"/>
      <rect x="20" y="120" width="22" height="22" rx="5" fill="#10B981"/>
      <rect x="50" y="120" width="22" height="22" rx="5" fill="#475569"/>
      <rect x="80" y="120" width="22" height="22" rx="5" fill="#3B82F6"/>
      <rect x="110" y="120" width="22" height="22" rx="5" fill="#10B981"/>
    </g>
    <rect x="20" y="154" width="64" height="26" rx="13" fill="#1A1F2E" stroke="#334155"/>
    <text class="mono" x="36" y="172" font-size="14" fill="#E2E8F0">sinfo</text>

    <!-- GPU: per-user utilization bars -->
    <text class="sans" x="20" y="210" font-size="16" fill="#94A3B8">GPU utilization</text>
    <g id="gpu-bars">
      <text class="mono" x="20" y="232" font-size="14" fill="#E2E8F0">charlie</text>
      <rect x="96" y="224" width="190" height="14" rx="7" fill="#1A1F2E"/>
      <rect x="96" y="224" width="152" height="14" rx="7" fill="#10B981"/>
      <text class="mono" x="296" y="236" font-size="13" fill="#94A3B8">82%</text>
      <text class="mono" x="20" y="256" font-size="14" fill="#E2E8F0">alex</text>
      <rect x="96" y="248" width="190" height="14" rx="7" fill="#1A1F2E"/>
      <rect x="96" y="248" width="88" height="14" rx="7" fill="#60A5FA"/>
      <text class="mono" x="296" y="260" font-size="13" fill="#94A3B8">46%</text>
    </g>
    <rect x="20" y="276" width="110" height="26" rx="13" fill="#1A1F2E" stroke="#334155"/>
    <text class="mono" x="36" y="294" font-size="14" fill="#E2E8F0">nvidia-smi</text>
  </g>
</svg>
